name = "ghost-angel-archive"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

# Create the database once — Cloudflare dashboard → Workers & Pages → D1 → Create
# database, or `npx wrangler d1 create ghost-angel-archive` — then paste its ID here.
# Cloudflare Workers Builds reads this file, so set the root directory to "worker"
# when connecting the repo. The Worker creates its own tables on first use.
[[d1_databases]]
binding = "DB"
database_name = "ghost-angel-archive"
database_id = "PASTE_YOUR_D1_ID_HERE"

[vars]
# The code at the end of the Ko-fi shop item link (ko-fi.com/s/2df1ab1b45).
# Orders for any other item are stored but never matched to a ritual.
SHOP_ITEM_CODE = "2df1ab1b45"
